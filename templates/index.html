<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flashcard</title>
</head>

<body>
    <div class="outer_card">
        <div class="card" id="card">
            <button class="card_front" id="card_front">{{ cards[0].word }}</button>
            <button class="card_back" id="card_back">{{ cards[0].definition }}</button>
        </div>
    </div>
    <div class="buttons">
        <button class="prev" id="prev">Prev</button>
        <button class="next" id="next">Next</button>
    </div>


<style>
    body {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        min-height: 100vh;
        margin: 0;
        font-family: sans-serif;
        background: #f4f4f8;
    }

    .outer_card {
        width: 80dvh;
        height: 60dvh;
    }

    .card {
        width: 100%;
        height: 100%;
    }

    .card_front,
    .card_back {
        width: 100%;
        height: 100%;
        background: #fff;
        border-radius: 12px;
        box-shadow: 5px 4px 12px rgba(0, 0, 0, 0.168);
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
        font-size: 30px;
        text-align: center;
    }

    .card_back {
        background: rgba(159, 196, 255, 0.132);
        font-size: 30px;
    }

    .outer_card {
        perspective: 1000px;
    }

    .card {
        position: relative;
        transform-style: preserve-3d;
        transition: transform 0.6s;
    }

    .card_front,
    .card_back {
        position: absolute;
        backface-visibility: hidden;
    }

    .card_back {
        transform: rotateY(180deg);
    }

    .card.flipped {
        transform: rotateY(180deg);
    }

    .buttons {
        margin-top: 20px;
        display: flex;
        gap: 10px;
    }

    .buttons button {
        padding: 8px 16px;
        border: none;
        border-radius: 6px;
        background: #333;
        color: #fff;
        cursor: pointer;
        font-size: 14px;
    }

    .buttons button:hover {
        background: #555;
    }
</style>
<script>
    const cards = {{ cards|tojson }};
    let index=0;


    const card = document.getElementById('card');
    const back = document.getElementById('card_back');
    const front = document.getElementById('card_front');
    const flipBtn = document.getElementById('flip');
    const nextBtn = document.getElementById('next');
    const prevBtn = document.getElementById('prev');

    function showCard() {
        front.textContent = cards[index].word;
        back.textContent = cards[index].definition;
        card.classList.remove('flipped');
    }

    card.addEventListener('click', function (){
        card.classList.toggle('flipped');
    })
    
    nextBtn.addEventListener('click', function(){
        index = index + 1;
        if(index >= cards.length) {
            index = 0;
        }
        showCard();
    });

    prevBtn.addEventListener('click', function(){
        index = index - 1;
        if (index < 0) {
            index = cards.length - 1;
        }
        showCard();
    });
</script>
</html>
